########################################
# IR4 MediaMTX — browser gateway for live wall
########################################
# Operators only edit RTSP in IR4 Cameras UI.
# Laravel pushes each Camera.stream_url here via MEDIAMTX_API_URL.
#
# On SCC (flattened app root next to artisan):
#   sudo docker run -d --name ir4-mediamtx --network host --restart unless-stopped \
#     -v "$PWD/scripts/mediamtx.yml:/mediamtx.yml:ro" \
#     bluenviron/mediamtx:latest
#
# Or: sudo systemctl enable --now ir4-mediamtx
# (see scripts/ir4-mediamtx.service)
#
# .env (from Lerd/Docker PHP use the host LAN IP, not 127.0.0.1):
#   CAMERA_BROWSER_STREAM_URL_TEMPLATE=http://<this-host>:8888/{reference}
#   MEDIAMTX_API_URL=http://<this-host>:9997
#   lerd artisan ir4:sync-camera-streams

logLevel: info

api: yes
apiAddress: :9997

# Browser playback (iframe on /live)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
hlsVariant: lowLatency

webrtc: yes
webrtcAddress: :8889

# Paths are created dynamically by IR4 (CameraStreamGatewayService).
paths: {}
