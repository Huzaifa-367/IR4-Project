########################################
# IR4 MediaMTX — browser gateway for live wall
########################################
# Operators only edit RTSP in IR4 Cameras UI.
# Laravel pushes each Camera.stream_url here via MEDIAMTX_API_URL.
#
# Start: sudo bash scripts/03-ensure-mediamtx.sh
#
# .env (from Lerd PHP — NOT 127.0.0.1):
#   CAMERA_BROWSER_STREAM_URL_TEMPLATE=/hls/{reference}/
#   MEDIAMTX_API_URL=http://<SCC-LAN-IP>:9997
#   MEDIAMTX_HOST_IP=<SCC-LAN-IP>
#   MEDIAMTX_SOURCE_ON_DEMAND=false
#   lerd artisan ir4:sync-camera-streams

logLevel: info

api: yes
apiAddress: :9997

# Newer MediaMTX images deny API by default unless `action: api` is granted.
# `user: any` + empty pass = anonymous (host curl and Laravel without Basic auth).
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

# Browser playback (live wall /hls proxy or direct :8888 on LAN HTTP)
hls: yes
hlsAddress: :8888
# Pre-generate HLS so the first viewer is not stuck waiting for remux.
hlsAlwaysRemux: yes
hlsVariant: lowLatency
# ponytail: MediaMTX v1.20 LL-HLS + hlsAlwaysRemux breaks below 7 (500 muxer unavailable).
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

webrtc: yes
webrtcAddress: :8889

# Default for paths created via API (RTSP pull from cameras).
pathDefaults:
  # TCP is more reliable across VLANs/firewalls than UDP RTP.
  rtspTransport: tcp

# Paths are created dynamically by IR4 (ir4:sync-camera-streams).
paths: {}
