########################################
# IR4 MediaMTX — browser gateway for live wall
########################################
# Operators only edit RTSP in IR4 Cameras UI.
# Laravel pushes each Camera.stream_url here via MEDIAMTX_API_URL.
#
# Start: sudo bash scripts/03-ensure-mediamtx.sh
#
# .env (from Lerd PHP — NOT 127.0.0.1):
#   CAMERA_BROWSER_STREAM_URL_TEMPLATE=http://<SCC-LAN-IP>:8888/{reference}
#   MEDIAMTX_API_URL=gateway
#   MEDIAMTX_API_USER=
#   MEDIAMTX_API_PASS=
#   lerd artisan ir4:sync-camera-streams

logLevel: info

api: yes
apiAddress: :9997

# Newer MediaMTX images deny API by default unless `action: api` is granted.
# `user: any` + empty pass = anonymous (host curl and Laravel without Basic auth).
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

# Browser playback (iframe on /live)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no
hlsVariant: lowLatency

webrtc: yes
webrtcAddress: :8889

# Paths are created dynamically by IR4 (CameraStreamGatewayService).
# From Lerd set MEDIAMTX_API_URL=gateway (resolves Docker/Podman default gateway).
paths: {}
