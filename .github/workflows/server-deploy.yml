name: Server Deploy

on:
  push:
    branches:
      - main
    paths:
      - "Server/**"
      - ".github/workflows/server-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Server

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, tokenizer, xml, curl, zip
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: Server/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('Server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --classmap-authoritative \
            --no-interaction \
            --no-progress

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      # Wayfinder bakes APP_URL into JS (e.g. form action). CI without a proper
      # APP_URL embeds http://localhost/... which breaks Hostinger (CORS / wrong host).
      # This creates a CI-only .env — it must be deleted before SCP so the live
      # Hostinger .env is never overwritten.
      - name: Prepare Laravel env for asset build
        env:
          APP_URL: https://ir4.ispc-ai.com
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          perl -i -pe 's|^APP_URL=.*|APP_URL=https://ir4.ispc-ai.com|' .env
          grep -E '^APP_URL=' .env
          php artisan wayfinder:generate --with-form

      - name: Build Vite assets
        env:
          APP_URL: https://ir4.ispc-ai.com
        run: npm run build

      - name: Prune development files
        run: |
          # Never ship CI secrets / APP_KEY onto Hostinger — keep server .env intact.
          rm -f .env .env.backup .env.production
          rm -rf \
            tests \
            node_modules \
            resources/js \
            resources/css \
            Tasks \
            database/factories \
            phpstan.neon \
            phpunit.xml \
            pint.json \
            eslint.config.js \
            vite.config.ts \
            tsconfig.json \
            package.json \
            package-lock.json \
            .prettierrc \
            .prettierignore \
            .editorconfig

      - name: Upload Laravel project
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          # Include Server/.htaccess (Hostinger public_html → public/ rewrite); globs skip dotfiles.
          # .env is removed in the prune step so live Hostinger config is preserved.
          source: "Server/*,Server/.htaccess,Server/public/.htaccess"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Finalize deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            cd "${{ env.DEPLOY_PATH }}"

            if [[ ! -f .env ]]; then
              echo "ERROR: ${DEPLOY_PATH}/.env is missing. Create it once on the host; deploys must not create/overwrite it." >&2
              exit 1
            fi

            mkdir -p storage/app/public bootstrap/cache
            chmod -R 775 storage bootstrap/cache || true

            # Drop cached config/routes before artisan boots. A stale config.php
            # from before spatie/laravel-backup was installed binds CleanupStrategy
            # to null and makes every artisan command fail.
            # Re-cache from the existing Hostinger .env (untouched by upload).
            rm -f bootstrap/cache/config.php \
              bootstrap/cache/routes-v7.php \
              bootstrap/cache/events.php \
              bootstrap/cache/blade-icons.php

            sh scripts/link-public-storage.sh

            php artisan optimize:clear
            php artisan migrate --force --no-interaction
            php artisan optimize

            echo "Deployment completed successfully (.env preserved)."
