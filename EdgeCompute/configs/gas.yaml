# IR4 gas agent — YT-98H Modbus RTU
# Secrets / per-pole refs: configs/secrets.env (IR4_GAS_*).

serial:
  # USB–RS485 on Orin USB port 3 → /dev/yt98h-rs485 (udev) or /dev/ttyUSB0
  # Prefer /dev/yt98h-rs485 (udev) or /dev/serial/by-id/...
  port: "/dev/yt98h-rs485"
  baud: 9600
  parity: "N"
  stopbits: 1

modbus_addresses: [1, 2, 3, 4, 5]

field_map:
  1: h2s_ppm
  2: co_ppm
  3: o2_pct
  4: lel_pct
  5: co2_ppm

agent:
  enabled: true
  # Overridden by IR4_GAS_DEVICE_REF in secrets.env when set (DEV-GAS-01 … DEV-GAS-04)
  device_ref: "DEV-GAS-01"
  poll_interval_seconds: 30   # 1 reading / 30s → POST /api/ingest/gas-readings
  heartbeat_interval_seconds: 60
  # Relative paths resolve under IR4_EDGE_VAR_DIR (default /opt/ir4-edge/var)
  buffer_path: "gas_buffer.sqlite"
