# IR4 RFID agent — FXR90 ZIOTC → Mosquitto → ingest
# Secrets / per-pole refs: configs/secrets.env (IR4_RFID_*).
# Lab WebSocket bring-up: Research/Edge/Zebra FXR90 Configuration/
#
# Tag JSON (verified): idHex, antenna, peakRssi, timestamp
# Reader must publish Tag Data to this MQTT topic (not LLRP).

mqtt:
  broker: "127.0.0.1"
  port: 1883
  # Overridden by IR4_RFID_MQTT_TOPIC in secrets.env when set (zebra/fxr90-NN/tags)
  topic: "zebra/fxr90-01/tags"
  # username/password from secrets.env; used only if IR4_MQTT_USE_AUTH=1

agent:
  enabled: true
  # Overridden by IR4_RFID_READER_REF in secrets.env when set (DEV-RFID-01 … DEV-RFID-04)
  reader_ref: "DEV-RFID-01"
  debounce_seconds: 2
  max_batch: 50
  flush_interval_seconds: 1
  heartbeat_interval_seconds: 60
  buffer_path: "rfid_buffer.sqlite"
  log_raw: false
