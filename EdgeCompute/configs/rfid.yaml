# IR4 RFID agent — FXR90 ZIOTC → Mosquitto → ingest
# Secrets: configs/secrets.env. Lab WebSocket bring-up: Research/Edge/Zebra FXR90 Configuration/
#
# Tag JSON (verified): idHex, antenna, peakRssi, timestamp
# Reader must publish Tag Data to this MQTT topic (not LLRP).

mqtt:
  broker: "127.0.0.1"
  port: 1883
  # Per pole: zebra/fxr90-01/tags … zebra/fxr90-04/tags (FXR90 IoT Connector must match)
  topic: "zebra/fxr90-02/tags"
  # username/password from secrets.env; used only if IR4_MQTT_USE_AUTH=1

agent:
  enabled: true
  # Per pole: DEV-RFID-01 … DEV-RFID-04 (must match secrets.env token → else FORBIDDEN_REFERENCE)
  reader_ref: "DEV-RFID-02"
  debounce_seconds: 2
  max_batch: 50
  flush_interval_seconds: 1
  heartbeat_interval_seconds: 60
  buffer_path: "rfid_buffer.sqlite"
  log_raw: false
