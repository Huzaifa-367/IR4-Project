# IR4 edge Mosquitto fragment for Orin J4012 (LAN-only RFID tag ingress).
# Install:
#   sudo cp deploy/mosquitto/ir4-edge.conf /etc/mosquitto/conf.d/ir4-edge.conf
#   sudo mosquitto_passwd -c /etc/mosquitto/ir4_passwd fxr90
#   sudo mosquitto_passwd /etc/mosquitto/ir4_passwd ir4-rfid
#   sudo chown mosquitto:mosquitto /etc/mosquitto/ir4_passwd
#   sudo systemctl restart mosquitto
#
# Bind to the Orin LAN address in production by setting listener below
# (replace 0.0.0.0 with the field NIC IP if you want a tighter fence).

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/ir4_passwd

# Optional persistence for short outages on the broker itself.
persistence true
persistence_location /var/lib/mosquitto/
