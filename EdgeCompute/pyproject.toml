[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ir4-edge"
version = "1.0.2"
description = "IR4 Orin edge agents for YT-98H gas and FXR90 RFID ingest"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.27,<0.29",
    "paho-mqtt>=2.0,<3",
    "pyserial>=3.5,<4",
    "PyYAML>=6.0,<7",
]

[project.scripts]
ir4-gas-agent = "ir4_edge.gas.agent:main"
ir4-rfid-agent = "ir4_edge.rfid.agent:main"
ir4-edge = "ir4_edge.ctl:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ir4_edge*"]
